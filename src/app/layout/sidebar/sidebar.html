<nav class="sidebar" aria-label="Menú principal">
  <h2>MÓDULOS</h2>

  @for (opcion of menu; track opcion.ruta) {
    <a
      [routerLink]="opcion.ruta"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span>{{ opcion.icono }}</span>
      {{ opcion.etiqueta }}
    </a>
  }
</nav>
