<header class="encabezado">
  <div class="marca">
    <span aria-hidden="true">☰</span>
    <strong>PharmaSoft</strong>
  </div>

  <nav aria-label="Menú superior">
    <a routerLink="/inicio">Inicio</a>
    <a
      href="http://localhost:8081/swagger-ui.html"
      target="_blank"
      rel="noopener noreferrer"
    >
      API
    </a>
  </nav>

  @if (auth.sesion(); as s) {
    <div class="usuario">
      <span class="nombre">{{ s.nombreCompleto }}</span>
      <span class="detalle">
        {{ s.roles.join(' · ') }} · expira {{ s.expiraEn | date: 'HH:mm' }}
      </span>
    </div>

    <button type="button" class="btn-salir" (click)="salir()">
      Cerrar sesión
    </button>
  }
</header>
